<div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="form">
         <div class="labelname">
          <div>Name:</div>
          <div><input type="text" placeholder="Please enter your name" #name/></div>
          <div><button type="button" class="btn btn-primary" (click)="editName(name.value)">Update Name</button></div>
         </div>
         <div class="labelname">
          <div>Email:</div>
          <div><input type="text" placeholder="Please enter your email" #email/></div>
          <div><button type="button" class="btn btn-primary" (click)="editEmail(email.value)">Update Name</button></div>
         </div>
         <div class="labelname">
          <div>Mobile:</div>
          <div><input type="text" placeholder="Please enter your mobile" #mobile/></div>
          <div><button type="button" class="btn btn-primary" (click)="editMobile(mobile.value)">Update Name</button></div>
         </div>
        </div>
    </div>
</div>
