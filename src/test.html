        function openPreviewForMultipleDoc() {

                picts_actioncodestext: selectedActionlabels? selectedActionlabels : [],
                picts_reasoncodestext: selectedReasonLabels? selectedReasonLabels : []
            }
            const payload = {
                data: data,
                records: records,
                documentType: documenttypeid
            };

            const pageInput = {
                pageType: "webresource",
                webresourceName: "picts_multi_document_preview.html",
                data: JSON.stringify(payload),
            };

            const navigationOptions = {
                target: 2,
                position: 1,
                width: { value: 70, unit: "%" },
                height: { value: 80, unit: "%" },
                title: "Request Document Preview"
            };

            Xrm.Navigation.navigateTo(pageInput, navigationOptions).then(function () {
                Xrm.Utility.refreshParentGrid();
            })
        }

        async function initializeCodeDropdowns() {

            const acodeEl = document.getElementById("actioncodeList");
            const rcodeEl = document.getElementById("reasoncodeList");
            document.getElementById("docCount").value = 0;

            if (!actioncodeChoices) {
                actioncodeChoices = new Choices(acodeEl, {
                    placeholderValue: "Select Action Codes",
                    removeItemButton: true,
                    searchEnabled: true,
                    closeDropdownOnSelect: false,
                    renderSelectedChoices: 'always'
                });

                acodeEl.addEventListener("change", () => {
                    selectedActionCodes = actioncodeChoices.getValue(true);
                    let raw = actioncodeChoices.getValue() || [];

                    let selectedActionCodeLabels = selectedActionCodes.map(val => {
                        const match = Array.isArray(raw) ? raw.find(item => {
                            if (typeof item === 'string') return item === val;
                            return (item.value === val) || (item.id === val);
                        }) : null;
                        return match ? (match.label ?? match.value) : val;
                    });
                    selectedActionlabels = selectedActionCodeLabels;
                    updateCount();
                });
            }

            if (!reasoncodeChoices) {
                reasoncodeChoices = new Choices(rcodeEl, {
                    placeholderValue: "Select Reason Codes",
                    removeItemButton: true,
                    searchEnabled: true,
                    closeDropdownOnSelect: false,
                    renderSelectedChoices: 'always'
                });

                rcodeEl.addEventListener("change", () => {
                    selectedReasonCodes = reasoncodeChoices.getValue(true);
                    let rawReasons = reasoncodeChoices.getValue() || [];

                    let selectedReasonCodeLabels = selectedReasonCodes.map(val => {
                        const match = Array.isArray(rawReasons) ? rawReasons.find(item => {
                            if (typeof item === 'string') return item === val;
                            return (item.value === val) || (item.id === val);
                        }) : null;
                        return match ? (match.label ?? match.value) : val;
                    });
                    selectedReasonLabels = selectedReasonCodeLabels;
                    updateCount();
                });
            }

            function updateCount() {
            const actioncode = selectedActionCodes.length || 0;
            const reasoncode = selectedReasonCodes.length || 0;

            const totalSelected = actioncode + reasoncode;
            if (totalSelected === 0){
                document.getElementById("request").style.display = "none"
            }
            else{
                document.getElementById("request").style.display = "block"
            }
        }

            try {

                // Fetch Action Codes
                const fetchXml = `<fetch version="1.0" output-format="xml-platform" mapping="logical" distinct="false">

                                    <attribute name="createdon" />

                                    <filter type="and">

                const actionResponse = await Xrm.WebApi.retrieveMultipleRecords(
                    "picts_recommendationsactioncodes",
                    "?fetchXml=" + encodeURIComponent(fetchXml)
                );

                const actionData = actionResponse.entities.map(item => ({
                    value: item.picts_recommendationsactioncodesid,
                    label: item.picts_name
                }));

                const fetch1 = `<fetch version="1.0" output-format="xml-platform" mapping="logical" distinct="false">
                                    <entity name="picts_recommendationsreasoncodes">
                                    <attribute name="picts_recommendationsreasoncodesid" />
                                    <attribute name="picts_name" />
                                    <attribute name="createdon" />
                                    <order attribute="picts_name" descending="false" />
                                    <filter type="and">
                                    <condition attribute="picts_reasoncodestatus" operator="eq" value="100000000" />
                                    </filter>
                                    </entity>
                                </fetch>`;

                //Fetch Reason Codes
                const reasonResponse = await Xrm.WebApi.retrieveMultipleRecords(
                    "picts_recommendationsreasoncodes",

                const reasonData = reasonResponse.entities.map(item => ({
                    value: item.picts_recommendationsreasoncodesid,

                // Clear old data
                actioncodeChoices.clearStore();

                actioncodeChoices.setChoices(

                reasoncodeChoices.setChoices(
                    [{ value: "", label: "No documents available", disabled: true }],

                    "label",

                // Set new data
                actioncodeChoices.setChoices(actionData, "value", "label", true);

                console.error("Error loading codes:", error);

            } finally {

                Xrm.Utility.closeProgressIndicator();

            }

        async function getDocumentUploadedRecords(id) {

            const fetchXml = `<fetch version="1.0" output-format="xml-platform" mapping="logical" distinct="false">
                                <entity name="picts_documentuploads">
                                    <attribute name="picts_documentuploadsid"/>
                                    <attribute name="picts_name"/>
                                    <attribute name="createdon"/>
                                    <attribute name="picts_documentlist"/>
                                    <order attribute="picts_name" descending="false"/>
                                    <filter type="and">
                                        <condition attribute="picts_case" operator="eq" uiname="004117-26" uitype="picts_case" value="{${primaryRecordId}}"/>
                                        <condition attribute="picts_documentstatus" operator="not-null"/>
                                    </filter>
                                    <link-entity name="picts_documents" from="picts_documentsid" to="picts_document" link-type="inner" alias="ag">
                                        <filter type="and">
                                            <condition attribute="picts_documenttype1" operator="eq" uiname="DP-38 No Print" uitype="picts_documenttype" value="{${id}}"/>
                       <condition attribute="picts_status" operator="ne" value="100000003" />
                                        </filter>
                                    </link-entity>
                                </entity>
                            </fetch>`;
            const result = await Xrm.WebApi.retrieveMultipleRecords(
                "picts_documentuploads",
                "?fetchXml=" + encodeURIComponent(fetchXml)
            );
            console.log('result::entities',result.entities.map(x => x._picts_documentlist_value));
            return result.entities.map(x => x._picts_documentlist_value);

        }
